openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: AgroNutri AI API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: farms
  - name: sectors
  - name: members
  - name: analyses
  - name: fertilizers
  - name: recommendations
  - name: settings
  - name: conversations
  - name: reports
  - name: phyto
  - name: usage
  - name: audit
  - name: dashboard
  - name: admin
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "204":
          description: "Si existe una cuenta con ese correo, se envía un email de recuperación"
  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "204":
          description: "Contraseña restablecida"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        "204":
          description: Logged out
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
    patch:
      operationId: updateMe
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /farms:
    get:
      operationId: listFarms
      tags: [farms]
      responses:
        "200":
          description: Farms visible to the user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Farm"
    post:
      operationId: createFarm
      tags: [farms]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FarmInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Farm"
  /farms/{farmId}:
    get:
      operationId: getFarm
      tags: [farms]
      parameters:
        - $ref: "#/components/parameters/FarmId"
      responses:
        "200":
          description: Farm detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Farm"
    patch:
      operationId: updateFarm
      tags: [farms]
      parameters:
        - $ref: "#/components/parameters/FarmId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FarmUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Farm"
    delete:
      operationId: deleteFarm
      tags: [farms]
      parameters:
        - $ref: "#/components/parameters/FarmId"
      responses:
        "204":
          description: Deleted
  /farms/{farmId}/summary:
    get:
      operationId: getFarmSummary
      tags: [farms]
      parameters:
        - $ref: "#/components/parameters/FarmId"
      responses:
        "200":
          description: Farm context panel summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FarmSummary"

  /farms/{farmId}/sectors:
    get:
      operationId: listSectors
      tags: [sectors]
      parameters:
        - $ref: "#/components/parameters/FarmId"
      responses:
        "200":
          description: Sectors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sector"
    post:
      operationId: createSector
      tags: [sectors]
      parameters:
        - $ref: "#/components/parameters/FarmId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SectorInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sector"
  /farms/{farmId}/sectors/{sectorId}:
    patch:
      operationId: updateSector
      tags: [sectors]
      parameters:
        - $ref: "#/components/parameters/FarmId"
        - $ref: "#/components/parameters/SectorId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SectorUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sector"
    delete:
      operationId: deleteSector
      tags: [sectors]
      parameters:
        - $ref: "#/components/parameters/FarmId"
        - $ref: "#/components/parameters/SectorId"
      responses:
        "204":
          description: Deleted

  /farms/{farmId}/members:
    get:
      operationId: listMembers
      tags: [members]
      parameters:
        - $ref: "#/components/parameters/FarmId"
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FarmMember"
    post:
      operationId: addMember
      tags: [members]
      parameters:
        - $ref: "#/components/parameters/FarmId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FarmMemberInput"
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FarmMember"
  /farms/{farmId}/members/{memberId}:
    patch:
      operationId: updateMember
      tags: [members]
      parameters:
        - $ref: "#/components/parameters/FarmId"
        - $ref: "#/components/parameters/MemberId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FarmMemberUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FarmMember"
    delete:
      operationId: removeMember
      tags: [members]
      parameters:
        - $ref: "#/components/parameters/FarmId"
        - $ref: "#/components/parameters/MemberId"
      responses:
        "204":
          description: Removed

  /farms/{farmId}/analyses:
    get:
      operationId: listAnalyses
      tags: [analyses]
      parameters:
        - $ref: "#/components/parameters/FarmId"
      responses:
        "200":
          description: Analyses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Analysis"
    post:
      operationId: createAnalysis
      tags: [analyses]
      parameters:
        - $ref: "#/components/parameters/FarmId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
  /farms/{farmId}/analyses/import:
    post:
      operationId: importAnalysisPdf
      tags: [analyses]
      summary: Upload a lab analysis PDF and extract its data with AI
      parameters:
        - $ref: "#/components/parameters/FarmId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Extracted analysis data for user review (not yet saved)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisInput"

  /farms/{farmId}/analyses/{analysisId}:
    get:
      operationId: getAnalysis
      tags: [analyses]
      parameters:
        - $ref: "#/components/parameters/FarmId"
        - $ref: "#/components/parameters/AnalysisId"
      responses:
        "200":
          description: Analysis detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
    put:
      operationId: updateAnalysis
      tags: [analyses]
      parameters:
        - $ref: "#/components/parameters/FarmId"
        - $ref: "#/components/parameters/AnalysisId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
    delete:
      operationId: deleteAnalysis
      tags: [analyses]
      parameters:
        - $ref: "#/components/parameters/FarmId"
        - $ref: "#/components/parameters/AnalysisId"
      responses:
        "204":
          description: Deleted

  /fertilizers:
    get:
      operationId: listFertilizers
      tags: [fertilizers]
      responses:
        "200":
          description: Fertilizer catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Fertilizer"
    post:
      operationId: createFertilizer
      tags: [fertilizers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FertilizerInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fertilizer"
  /fertilizers/{fertilizerId}:
    patch:
      operationId: updateFertilizer
      tags: [fertilizers]
      parameters:
        - $ref: "#/components/parameters/FertilizerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FertilizerUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fertilizer"
    delete:
      operationId: deleteFertilizer
      tags: [fertilizers]
      parameters:
        - $ref: "#/components/parameters/FertilizerId"
      responses:
        "204":
          description: Deleted

  /farms/{farmId}/recommendations:
    get:
      operationId: listRecommendations
      tags: [recommendations]
      parameters:
        - $ref: "#/components/parameters/FarmId"
      responses:
        "200":
          description: Recommendations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Recommendation"
    post:
      operationId: createRecommendation
      tags: [recommendations]
      parameters:
        - $ref: "#/components/parameters/FarmId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecommendationInput"
      responses:
        "201":
          description: Created draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recommendation"
  /mobile-app:
    get:
      operationId: getMobileAppUrl
      tags: [misc]
      summary: URL of the mobile web app (for QR access)
      responses:
        "200":
          description: Mobile app URL
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string, nullable: true }
  /product-sheets:
    get:
      operationId: listProductSheets
      tags: [misc]
      summary: List saved plant nutrition product sheets
      responses:
        "200":
          description: Product sheets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductSheet"
  /product-sheets/{sheetId}:
    delete:
      operationId: deleteProductSheet
      tags: [misc]
      summary: Delete a saved product sheet
      parameters:
        - name: sheetId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
  /farms/{farmId}/recommendations/ai-draft:
    post:
      operationId: generateAiDraftRecommendation
      tags: [recommendations]
      summary: Generate an AI draft fertigation program from the latest analyses
      parameters:
        - $ref: "#/components/parameters/FarmId"
      responses:
        "201":
          description: Created AI draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recommendation"
  /farms/{farmId}/recommendations/{recommendationId}:
    get:
      operationId: getRecommendation
      tags: [recommendations]
      parameters:
        - $ref: "#/components/parameters/FarmId"
        - $ref: "#/components/parameters/RecommendationId"
      responses:
        "200":
          description: Recommendation detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recommendation"
    patch:
      operationId: updateRecommendation
      tags: [recommendations]
      parameters:
        - $ref: "#/components/parameters/FarmId"
        - $ref: "#/components/parameters/RecommendationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecommendationUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recommendation"
  /farms/{farmId}/recommendations/{recommendationId}/status:
    post:
      operationId: changeRecommendationStatus
      tags: [recommendations]
      parameters:
        - $ref: "#/components/parameters/FarmId"
        - $ref: "#/components/parameters/RecommendationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecommendationStatusChange"
      responses:
        "200":
          description: Status changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recommendation"
  /farms/{farmId}/calculations:
    post:
      operationId: runCalculation
      tags: [recommendations]
      summary: Run the deterministic fertigation engine
      parameters:
        - $ref: "#/components/parameters/FarmId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalculationRequest"
      responses:
        "200":
          description: Calculation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalculationResult"

  /settings/openai:
    get:
      operationId: listCredentials
      tags: [settings]
      responses:
        "200":
          description: Masked credentials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Credential"
    post:
      operationId: createCredential
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialInput"
      responses:
        "201":
          description: Stored (masked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
  /settings/openai/{credentialId}:
    patch:
      operationId: updateCredential
      tags: [settings]
      parameters:
        - $ref: "#/components/parameters/CredentialId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialUpdate"
      responses:
        "200":
          description: Updated (masked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
    delete:
      operationId: deleteCredential
      tags: [settings]
      parameters:
        - $ref: "#/components/parameters/CredentialId"
      responses:
        "204":
          description: Deleted
  /settings/openai/{credentialId}/test:
    post:
      operationId: testCredential
      tags: [settings]
      parameters:
        - $ref: "#/components/parameters/CredentialId"
      responses:
        "200":
          description: Connection test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialTestResult"
  /farms/{farmId}/api-config:
    get:
      operationId: getFarmApiConfig
      tags: [settings]
      parameters:
        - $ref: "#/components/parameters/FarmId"
      responses:
        "200":
          description: Farm-specific credential override
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FarmApiConfig"
    put:
      operationId: setFarmApiConfig
      tags: [settings]
      parameters:
        - $ref: "#/components/parameters/FarmId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FarmApiConfigInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FarmApiConfig"

  /farms/{farmId}/conversations:
    get:
      operationId: listConversations
      tags: [conversations]
      parameters:
        - $ref: "#/components/parameters/FarmId"
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
    post:
      operationId: createConversation
      tags: [conversations]
      parameters:
        - $ref: "#/components/parameters/FarmId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
  /farms/{farmId}/conversations/{conversationId}:
    get:
      operationId: getConversation
      tags: [conversations]
      parameters:
        - $ref: "#/components/parameters/FarmId"
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationDetail"
    delete:
      operationId: deleteConversation
      tags: [conversations]
      parameters:
        - $ref: "#/components/parameters/FarmId"
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "204":
          description: Deleted
  /farms/{farmId}/conversations/{conversationId}/messages:
    post:
      operationId: sendMessage
      tags: [conversations]
      summary: Send a message to the virtual agronomist and receive its reply
      parameters:
        - $ref: "#/components/parameters/FarmId"
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "200":
          description: Assistant reply (includes the stored user message and assistant message)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
  /farms/{farmId}/conversations/{conversationId}/attachments:
    post:
      operationId: uploadConversationAttachment
      tags: [conversations]
      summary: Attach a document (PDF) or image to the conversation; its content is extracted and added as a user message
      parameters:
        - $ref: "#/components/parameters/FarmId"
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                note:
                  type: string
      responses:
        "201":
          description: Stored user message containing the extracted content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /farms/{farmId}/conversations/{conversationId}/messages/{messageId}/draft-recommendation:
    post:
      operationId: createDraftFromMessage
      tags: [conversations]
      summary: Turn an assistant reply into a draft fertilization program (source ai)
      parameters:
        - $ref: "#/components/parameters/FarmId"
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/MessageId"
      responses:
        "201":
          description: Draft recommendation created from the assistant message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recommendation"

  /farms/{farmId}/reports:
    get:
      operationId: listReports
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/FarmId"
      responses:
        "200":
          description: Reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Report"
    post:
      operationId: createReport
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/FarmId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportInput"
      responses:
        "201":
          description: Generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"

  /farms/{farmId}/reports/notes-preview:
    post:
      operationId: previewReportNotes
      tags: [reports]
      summary: Generate an on-demand preview of the «Observaciones del técnico» section for a conversation
      parameters:
        - $ref: "#/components/parameters/FarmId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportNotesPreviewInput"
      responses:
        "200":
          description: Preview of the technician notes that would appear in the report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportNotesPreview"

  /farms/{farmId}/phyto/treatments:
    get:
      operationId: listPhytoTreatments
      tags: [phyto]
      summary: List phytosanitary treatments of a farm
      parameters:
        - $ref: "#/components/parameters/FarmId"
      responses:
        "200":
          description: Treatments ordered by application date (newest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PhytoTreatment"
    post:
      operationId: createPhytoTreatment
      tags: [phyto]
      summary: Register a phytosanitary application
      parameters:
        - $ref: "#/components/parameters/FarmId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhytoTreatmentCreate"
      responses:
        "201":
          description: Treatment registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhytoTreatment"

  /farms/{farmId}/phyto/treatments/{treatmentId}:
    delete:
      operationId: deletePhytoTreatment
      tags: [phyto]
      summary: Delete a phytosanitary treatment record
      parameters:
        - $ref: "#/components/parameters/FarmId"
        - name: treatmentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /farms/{farmId}/phyto/consult:
    post:
      operationId: phytoConsult
      tags: [phyto]
      summary: Ask the AI phytosanitary advisor (checks official registries via web search)
      parameters:
        - $ref: "#/components/parameters/FarmId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhytoConsultInput"
      responses:
        "200":
          description: AI answer with cited sources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhytoConsultResult"

  /farms/{farmId}/phyto/plan-pdf:
    post:
      operationId: phytoPlanPdf
      tags: [phyto]
      summary: Download the AI advisor's treatment plan as a PDF report
      parameters:
        - $ref: "#/components/parameters/FarmId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhytoPlanPdfInput"
      responses:
        "200":
          description: PDF file with the full treatment plan
          content:
            application/pdf:
              schema: { type: string, format: binary }

  /phyto/products:
    get:
      operationId: listPhytoProducts
      tags: [phyto]
      summary: List the shared catalog of authorized phytosanitary products
      responses:
        "200":
          description: Catalog entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PhytoProduct"
    post:
      operationId: createPhytoProduct
      tags: [phyto]
      summary: Add or update (by registry number or name) a product in the catalog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhytoProductCreate"
      responses:
        "201":
          description: Created or updated entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhytoProduct"

  /phyto/products/{productId}:
    delete:
      operationId: deletePhytoProduct
      tags: [phyto]
      summary: Remove a product from the catalog (admin or creator)
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /usage:
    get:
      operationId: getUsage
      tags: [usage]
      parameters:
        - name: month
          in: query
          required: false
          description: Month in YYYY-MM format; defaults to current month
          schema:
            type: string
      responses:
        "200":
          description: Monthly AI usage summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageSummary"

  /audit:
    get:
      operationId: listAuditLog
      tags: [audit]
      parameters:
        - name: farmId
          in: query
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Audit entries (admin sees all; others see own farms)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEntry"

  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      responses:
        "200":
          description: Global dashboard for current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /auth/config:
    get:
      operationId: getAuthConfig
      tags: [auth]
      summary: Public auth configuration (no session required)
      security: []
      responses:
        "200":
          description: Auth configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthConfig"

  /admin/users:
    get:
      operationId: adminListUsers
      tags: [admin]
      summary: List all users (admin only)
      responses:
        "200":
          description: All users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
    post:
      operationId: adminCreateUser
      tags: [admin]
      summary: Create a user (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserCreate"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"

  /admin/users/{userId}:
    patch:
      operationId: adminUpdateUser
      tags: [admin]
      summary: Update a user (admin only)
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
    delete:
      operationId: adminDeleteUser
      tags: [admin]
      summary: Delete a user (admin only)
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: Deleted

  /admin/farms:
    get:
      operationId: adminListFarms
      tags: [admin]
      summary: List all farms (admin only)
      responses:
        "200":
          description: All farms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminFarm"

  /admin/farms/{farmId}:
    delete:
      operationId: adminDeleteFarm
      tags: [admin]
      summary: Delete a farm (admin only)
      parameters:
        - $ref: "#/components/parameters/FarmId"
      responses:
        "204":
          description: Deleted

  /admin/settings/email:
    get:
      operationId: adminGetEmailSettings
      tags: [admin]
      summary: Get email (Resend) settings (admin only)
      responses:
        "200":
          description: Email settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEmailSettings"
    put:
      operationId: adminUpdateEmailSettings
      tags: [admin]
      summary: Update email (Resend) settings (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminEmailSettingsInput"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEmailSettings"

components:
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
    FarmId:
      name: farmId
      in: path
      required: true
      schema:
        type: integer
    SectorId:
      name: sectorId
      in: path
      required: true
      schema:
        type: integer
    MemberId:
      name: memberId
      in: path
      required: true
      schema:
        type: integer
    AnalysisId:
      name: analysisId
      in: path
      required: true
      schema:
        type: integer
    FertilizerId:
      name: fertilizerId
      in: path
      required: true
      schema:
        type: integer
    RecommendationId:
      name: recommendationId
      in: path
      required: true
      schema:
        type: integer
    CredentialId:
      name: credentialId
      in: path
      required: true
      schema:
        type: integer
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: integer
    MessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: integer

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    RegisterInput:
      type: object
      required: [email, password, name]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        name: { type: string, minLength: 1 }
        company: { type: string }
        phone: { type: string }
    ForgotPasswordInput:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    ResetPasswordInput:
      type: object
      required: [token, password]
      properties:
        token: { type: string, minLength: 1 }
        password: { type: string, minLength: 8 }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    UserProfile:
      type: object
      required: [id, email, name, role, isAdmin]
      properties:
        id: { type: integer }
        email: { type: string }
        name: { type: string }
        company: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        role: { type: string }
        isAdmin: { type: boolean }
        unitsPreference: { type: ["string", "null"] }
        reportLanguage: { type: ["string", "null"] }
        aiMonthlyLimitEur: { type: ["number", "null"] }
        aiResponseStyle: { type: ["string", "null"] }
        token:
          type: ["string", "null"]
          description: "Session token for Bearer auth (returned by login/register; used by the mobile app)"
    UserProfileUpdate:
      type: object
      properties:
        name: { type: string }
        company: { type: string }
        phone: { type: string }
        unitsPreference: { type: string }
        reportLanguage: { type: string }
        aiMonthlyLimitEur: { type: ["number", "null"] }
        aiResponseStyle: { type: string }
        password: { type: string, minLength: 8 }

    AdminUser:
      type: object
      required: [id, email, name, role, isAdmin, active, farmCount, createdAt]
      properties:
        id: { type: integer }
        email: { type: string }
        name: { type: string }
        company: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        role: { type: string }
        isAdmin: { type: boolean }
        active: { type: boolean }
        aiMonthlyLimitEur: { type: ["number", "null"] }
        farmCount: { type: integer }
        createdAt: { type: string }
    AdminUserUpdate:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1 }
        role: { type: string, enum: [owner, technician, manager, viewer] }
        isAdmin: { type: boolean }
        active: { type: boolean }
        aiMonthlyLimitEur: { type: ["number", "null"], minimum: 0 }
        password: { type: string, minLength: 8 }
    PhytoTreatment:
      type: object
      required: [id, farmId, sectorId, sectorName, applicationDate, productName, registryNumber, activeIngredient, targetPest, doseAmount, doseUnit, waterVolumeL, areaHa, safetyDays, notes, createdByName, createdAt]
      properties:
        id: { type: integer }
        farmId: { type: integer }
        sectorId: { type: integer, nullable: true }
        sectorName: { type: string, nullable: true }
        applicationDate: { type: string }
        productName: { type: string }
        registryNumber: { type: string, nullable: true }
        activeIngredient: { type: string, nullable: true }
        targetPest: { type: string, nullable: true }
        doseAmount: { type: number, nullable: true }
        doseUnit: { type: string, nullable: true }
        waterVolumeL: { type: number, nullable: true }
        areaHa: { type: number, nullable: true }
        safetyDays: { type: integer, nullable: true }
        notes: { type: string, nullable: true }
        createdByName: { type: string, nullable: true }
        createdAt: { type: string }
    PhytoTreatmentCreate:
      type: object
      required: [applicationDate, productName]
      properties:
        sectorId: { type: integer, nullable: true }
        applicationDate: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$", description: "YYYY-MM-DD" }
        productName: { type: string, minLength: 1, maxLength: 200 }
        registryNumber: { type: string, nullable: true, maxLength: 50 }
        activeIngredient: { type: string, nullable: true, maxLength: 200 }
        targetPest: { type: string, nullable: true, maxLength: 200 }
        doseAmount: { type: number, nullable: true, minimum: 0 }
        doseUnit: { type: string, nullable: true, maxLength: 20 }
        waterVolumeL: { type: number, nullable: true, minimum: 0 }
        areaHa: { type: number, nullable: true, minimum: 0 }
        safetyDays: { type: integer, nullable: true, minimum: 0 }
        notes: { type: string, nullable: true, maxLength: 2000 }
    PhytoConsultInput:
      type: object
      required: [question]
      properties:
        question: { type: string, minLength: 1, maxLength: 4000 }
        targetPest: { type: string, nullable: true }
        sectorId: { type: integer, nullable: true }
    PhytoConsultResult:
      type: object
      required: [answer, sources]
      properties:
        answer: { type: string }
        sources:
          type: array
          items: { type: string }
    PhytoPlanPdfInput:
      type: object
      required: [answer]
      properties:
        answer: { type: string, minLength: 1, maxLength: 40000 }
        question: { type: string, nullable: true, maxLength: 4000 }
        pests:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 120 }
        sources:
          type: array
          maxItems: 30
          items: { type: string, maxLength: 600, pattern: "^https?://" }
    PhytoProduct:
      type: object
      required: [id, productName, registryNumber, activeIngredient, pests, doseInfo, maxApplicationsYear, safetyDays, expiryDate, exceptional, notes, sourceUrl, lastVerifiedAt, createdByName, updatedAt]
      properties:
        id: { type: integer }
        productName: { type: string }
        registryNumber: { type: string, nullable: true }
        activeIngredient: { type: string, nullable: true }
        pests: { type: string, nullable: true }
        doseInfo: { type: string, nullable: true }
        maxApplicationsYear: { type: integer, nullable: true }
        safetyDays: { type: integer, nullable: true }
        expiryDate: { type: string, nullable: true, description: "YYYY-MM-DD end of authorization" }
        exceptional: { type: boolean }
        notes: { type: string, nullable: true }
        sourceUrl: { type: string, nullable: true }
        lastVerifiedAt: { type: string, nullable: true }
        createdByName: { type: string, nullable: true }
        updatedAt: { type: string }
    PhytoProductCreate:
      type: object
      required: [productName]
      properties:
        productName: { type: string, minLength: 1, maxLength: 200 }
        registryNumber: { type: string, nullable: true, maxLength: 50 }
        activeIngredient: { type: string, nullable: true, maxLength: 200 }
        pests: { type: string, nullable: true, maxLength: 500 }
        doseInfo: { type: string, nullable: true, maxLength: 500 }
        maxApplicationsYear: { type: integer, nullable: true, minimum: 0 }
        safetyDays: { type: integer, nullable: true, minimum: 0 }
        expiryDate: { type: string, nullable: true, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        exceptional: { type: boolean }
        notes: { type: string, nullable: true, maxLength: 2000 }
        sourceUrl: { type: string, nullable: true, maxLength: 500 }
    AuthConfig:
      type: object
      required: [registrationEnabled]
      properties:
        registrationEnabled: { type: boolean }
    AdminUserCreate:
      type: object
      required: [email, name, password]
      properties:
        email: { type: string, format: email }
        name: { type: string, minLength: 1 }
        password: { type: string, minLength: 8 }
        company: { type: ["string", "null"] }
        role: { type: string, enum: [owner, technician, manager, viewer] }
        isAdmin: { type: boolean }
    AdminEmailSettings:
      type: object
      required: [configured, source]
      properties:
        configured: { type: boolean, description: Hay una clave de Resend disponible }
        source: { type: string, enum: [db, env, none], description: De dónde sale la clave activa }
        apiKeyMasked: { type: ["string", "null"], description: Clave guardada en BD, enmascarada }
        emailFrom: { type: ["string", "null"], description: Remitente configurado en BD }
    AdminEmailSettingsInput:
      type: object
      properties:
        resendApiKey:
          type: ["string", "null"]
          maxLength: 200
          description: Clave de API de Resend; null o vacío la borra
        emailFrom:
          type: ["string", "null"]
          maxLength: 200
          description: Remitente, p. ej. "AgroNutri <no-reply@midominio.com>"; null o vacío lo borra

    AdminFarm:
      type: object
      required: [id, ownerId, ownerName, name, memberCount]
      properties:
        id: { type: integer }
        ownerId: { type: integer }
        ownerName: { type: string }
        name: { type: string }
        companyName: { type: ["string", "null"] }
        island: { type: ["string", "null"] }
        municipality: { type: ["string", "null"] }
        plantCount: { type: ["integer", "null"] }
        surfaceHa: { type: ["number", "null"] }
        memberCount: { type: integer }
        createdAt: { type: ["string", "null"] }

    Farm:
      type: object
      required: [id, ownerId, name, myRole]
      properties:
        id: { type: integer }
        ownerId: { type: integer }
        name: { type: string }
        companyName: { type: ["string", "null"] }
        cif: { type: ["string", "null"] }
        island: { type: ["string", "null"] }
        municipality: { type: ["string", "null"] }
        latitude: { type: ["number", "null"] }
        longitude: { type: ["number", "null"] }
        altitudeM: { type: ["number", "null"] }
        surfaceHa: { type: ["number", "null"] }
        mainCrop: { type: ["string", "null"] }
        variety: { type: ["string", "null"] }
        plantCount: { type: ["integer", "null"] }
        phenologicalStage: { type: ["string", "null"] }
        cropSystem: { type: ["string", "null"] }
        soilType: { type: ["string", "null"] }
        hasDrainage: { type: ["boolean", "null"] }
        foliarAllowed: { type: ["boolean", "null"] }
        hasDesalinatedWater: { type: ["boolean", "null"] }
        desalinatedWaterPct: { type: ["number", "null"] }
        weeklyLitresPerPlant: { type: ["number", "null"] }
        maxEcDsM: { type: ["number", "null"] }
        managementNotes: { type: ["string", "null"] }
        responsibleTechnician: { type: ["string", "null"] }
        myRole: { type: string, description: "owner | technician | manager | viewer" }
        sectorCount: { type: ["integer", "null"] }
    FarmInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        companyName: { type: string }
        cif: { type: string }
        island: { type: string }
        municipality: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        altitudeM: { type: number }
        surfaceHa: { type: number }
        mainCrop: { type: string }
        variety: { type: string }
        plantCount: { type: integer }
        phenologicalStage: { type: string }
        cropSystem: { type: string }
        soilType: { type: string }
        hasDrainage: { type: boolean }
        foliarAllowed: { type: boolean }
        hasDesalinatedWater: { type: boolean }
        desalinatedWaterPct: { type: number }
        weeklyLitresPerPlant: { type: number }
        maxEcDsM: { type: number }
        managementNotes: { type: string }
        responsibleTechnician: { type: string }
    FarmUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        companyName: { type: string }
        cif: { type: string }
        island: { type: string }
        municipality: { type: string }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        altitudeM: { type: number, nullable: true }
        surfaceHa: { type: number, nullable: true }
        mainCrop: { type: string }
        variety: { type: string }
        plantCount: { type: integer, nullable: true }
        phenologicalStage: { type: string }
        cropSystem: { type: string }
        soilType: { type: string }
        hasDrainage: { type: boolean }
        foliarAllowed: { type: boolean }
        hasDesalinatedWater: { type: boolean }
        desalinatedWaterPct: { type: number, nullable: true }
        weeklyLitresPerPlant: { type: number, nullable: true }
        maxEcDsM: { type: number, nullable: true }
        managementNotes: { type: string }
        responsibleTechnician: { type: string }
    FarmSummary:
      type: object
      required: [farm]
      properties:
        farm:
          $ref: "#/components/schemas/Farm"
        weeklyWaterM3: { type: ["number", "null"] }
        latestSoilAnalysis:
          oneOf:
            - $ref: "#/components/schemas/Analysis"
            - type: "null"
        latestLeafAnalysis:
          oneOf:
            - $ref: "#/components/schemas/Analysis"
            - type: "null"
        latestWaterAnalysis:
          oneOf:
            - $ref: "#/components/schemas/Analysis"
            - type: "null"
        activeRecommendation:
          oneOf:
            - $ref: "#/components/schemas/Recommendation"
            - type: "null"
        alerts:
          type: array
          items:
            type: string
        aiAvailable: { type: boolean }

    Sector:
      type: object
      required: [id, farmId, name]
      properties:
        id: { type: integer }
        farmId: { type: integer }
        name: { type: string }
        plantCount: { type: ["integer", "null"] }
        surfaceHa: { type: ["number", "null"] }
        weeklyLitresPerPlant: { type: ["number", "null"] }
        phenologicalStage: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
    SectorInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        plantCount: { type: integer }
        surfaceHa: { type: number }
        weeklyLitresPerPlant: { type: number }
        phenologicalStage: { type: string }
        notes: { type: string }
    SectorUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        plantCount: { type: ["integer", "null"] }
        surfaceHa: { type: ["number", "null"] }
        weeklyLitresPerPlant: { type: ["number", "null"] }
        phenologicalStage: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }

    FarmMember:
      type: object
      required: [id, farmId, userId, role, name, email]
      properties:
        id: { type: integer }
        farmId: { type: integer }
        userId: { type: integer }
        role: { type: string, description: "technician | manager | viewer" }
        name: { type: string }
        email: { type: string }
    FarmMemberInput:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role: { type: string, enum: [technician, manager, viewer] }
    FarmMemberUpdate:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [technician, manager, viewer] }

    Analysis:
      type: object
      required: [id, farmId, type, sampleDate, parameters]
      properties:
        id: { type: integer }
        farmId: { type: integer }
        sectorId: { type: ["integer", "null"] }
        type: { type: string, enum: [soil, leaf, water] }
        reference: { type: ["string", "null"] }
        laboratory: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        sampleDate: { type: string, description: "YYYY-MM-DD" }
        parameters:
          type: array
          items:
            $ref: "#/components/schemas/AnalysisParameter"
        notes: { type: ["string", "null"] }
        createdAt: { type: ["string", "null"] }
    AnalysisParameter:
      type: object
      required: [name, value]
      properties:
        name: { type: string }
        value: { type: number }
        unit: { type: ["string", "null"] }
        refLow: { type: ["number", "null"] }
        refHigh: { type: ["number", "null"] }
        status: { type: ["string", "null"], description: "muy_bajo | bajo | normal | alto | muy_alto" }
    AnalysisInput:
      type: object
      required: [type, sampleDate, parameters]
      properties:
        sectorId: { type: integer }
        type: { type: string, enum: [soil, leaf, water] }
        reference: { type: string }
        laboratory: { type: string }
        description: { type: string }
        sampleDate: { type: string }
        parameters:
          type: array
          items:
            $ref: "#/components/schemas/AnalysisParameter"
        notes: { type: string }

    Fertilizer:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
        formulaType: { type: ["string", "null"], description: "solid | liquid" }
        usage: { type: ["string", "null"], description: "fertirrigacion | enmienda" }
        nPct: { type: ["number", "null"] }
        nNitricPct: { type: ["number", "null"] }
