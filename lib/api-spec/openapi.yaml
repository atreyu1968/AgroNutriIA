openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: AgroNutri AI API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: farms
  - name: sectors
  - name: members
  - name: analyses
  - name: fertilizers
  - name: recommendations
  - name: settings
  - name: conversations
  - name: reports
  - name: phyto
  - name: usage
  - name: audit
  - name: dashboard
  - name: admin
  - name: signup
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "204":
          description: "Si existe una cuenta con ese correo, se envía un email de recuperación"
  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "204":
          description: "Contraseña restablecida"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        "204":
          description: Logged out
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
    patch:
      operationId: updateMe
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /farms:
    get:
      operationId: listFarms
      tags: [farms]
      responses:
        "200":
          description: Farms visible to the user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Farm"
    post:
      operationId: createFarm
      tags: [farms]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FarmInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Farm"
  /farms/{farmId}:
    get:
      operationId: getFarm
      tags: [farms]
      parameters:
        - $ref: "#/components/parameters/FarmId"
      responses:
        "200":
          description: Farm detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Farm"
    patch:
      operationId: updateFarm
      tags: [farms]
      parameters:
        - $ref: "#/components/parameters/FarmId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FarmUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Farm"
    delete:
      operationId: deleteFarm
      tags: [farms]
      parameters:
        - $ref: "#/components/parameters/FarmId"
      responses:
        "204":
          description: Deleted
  /farms/{farmId}/summary:
    get:
      operationId: getFarmSummary
      tags: [farms]
      parameters:
        - $ref: "#/components/parameters/FarmId"
      responses:
        "200":
          description: Farm context panel summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FarmSummary"

  /farms/{farmId}/sectors:
    get:
      operationId: listSectors
      tags: [sectors]
      parameters:
        - $ref: "#/components/parameters/FarmId"
      responses:
        "200":
          description: Sectors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sector"
    post:
      operationId: createSector
      tags: [sectors]
      parameters:
        - $ref: "#/components/parameters/FarmId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SectorInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sector"
  /farms/{farmId}/sectors/{sectorId}:
    patch:
      operationId: updateSector
      tags: [sectors]
      parameters:
        - $ref: "#/components/parameters/FarmId"
        - $ref: "#/components/parameters/SectorId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SectorUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sector"
    delete:
      operationId: deleteSector
      tags: [sectors]
      parameters:
        - $ref: "#/components/parameters/FarmId"
        - $ref: "#/components/parameters/SectorId"
      responses:
        "204":
          description: Deleted

  /farms/{farmId}/members:
    get:
      operationId: listMembers
      tags: [members]
      parameters:
        - $ref: "#/components/parameters/FarmId"
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FarmMember"
    post:
      operationId: addMember
      tags: [members]
      parameters:
        - $ref: "#/components/parameters/FarmId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FarmMemberInput"
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FarmMember"
  /farms/{farmId}/members/{memberId}:
    patch:
      operationId: updateMember
      tags: [members]
      parameters:
        - $ref: "#/components/parameters/FarmId"
        - $ref: "#/components/parameters/MemberId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FarmMemberUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FarmMember"
    delete:
      operationId: removeMember
      tags: [members]
      parameters:
        - $ref: "#/components/parameters/FarmId"
        - $ref: "#/components/parameters/MemberId"
      responses:
        "204":
          description: Removed

  /farms/{farmId}/analyses:
    get:
      operationId: listAnalyses
      tags: [analyses]
      parameters:
        - $ref: "#/components/parameters/FarmId"
      responses:
        "200":
          description: Analyses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Analysis"
    post:
      operationId: createAnalysis
      tags: [analyses]
      parameters:
        - $ref: "#/components/parameters/FarmId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
  /farms/{farmId}/analyses/import:
    post:
      operationId: importAnalysisPdf
      tags: [analyses]
      summary: Upload a lab analysis PDF and extract its data with AI
      parameters:
        - $ref: "#/components/parameters/FarmId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Extracted analysis data for user review (not yet saved)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisInput"

  /farms/{farmId}/analyses/{analysisId}:
    get:
      operationId: getAnalysis
      tags: [analyses]
      parameters:
        - $ref: "#/components/parameters/FarmId"
        - $ref: "#/components/parameters/AnalysisId"
      responses:
        "200":
          description: Analysis detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
    put:
      operationId: updateAnalysis
      tags: [analyses]
      parameters:
        - $ref: "#/components/parameters/FarmId"
        - $ref: "#/components/parameters/AnalysisId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
    delete:
      operationId: deleteAnalysis
      tags: [analyses]
      parameters:
        - $ref: "#/components/parameters/FarmId"
        - $ref: "#/components/parameters/AnalysisId"
      responses:
        "204":
          description: Deleted

  /fertilizers:
    get:
      operationId: listFertilizers
      tags: [fertilizers]
      responses:
        "200":
          description: Fertilizer catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Fertilizer"
    post:
      operationId: createFertilizer
      tags: [fertilizers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FertilizerInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fertilizer"
  /fertilizers/{fertilizerId}:
    patch:
      operationId: updateFertilizer
      tags: [fertilizers]
      parameters:
        - $ref: "#/components/parameters/FertilizerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FertilizerUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fertilizer"
    delete:
      operationId: deleteFertilizer
      tags: [fertilizers]
      parameters:
        - $ref: "#/components/parameters/FertilizerId"
      responses:
        "204":
          description: Deleted

  /farms/{farmId}/recommendations:
    get:
      operationId: listRecommendations
      tags: [recommendations]
      parameters:
        - $ref: "#/components/parameters/FarmId"
      responses:
        "200":
          description: Recommendations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Recommendation"
    post:
      operationId: createRecommendation
      tags: [recommendations]
      parameters:
        - $ref: "#/components/parameters/FarmId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecommendationInput"
      responses:
        "201":
          description: Created draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recommendation"
  /mobile-app:
    get:
      operationId: getMobileAppUrl
      tags: [misc]
      summary: URL of the mobile web app (for QR access)
      responses:
        "200":
          description: Mobile app URL
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string, nullable: true }
  /product-sheets:
    get:
      operationId: listProductSheets
      tags: [misc]
      summary: List saved plant nutrition product sheets
      responses:
        "200":
          description: Product sheets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductSheet"
  /product-sheets/{sheetId}:
    delete:
      operationId: deleteProductSheet
      tags: [misc]
      summary: Delete a saved product sheet
      parameters:
        - name: sheetId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
  /farms/{farmId}/recommendations/ai-draft:
    post:
      operationId: generateAiDraftRecommendation
      tags: [recommendations]
      summary: Generate an AI draft fertigation program from the latest analyses
      parameters:
        - $ref: "#/components/parameters/FarmId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                sectorId:
                  type: ["integer", "null"]
                  description: "Sector objetivo del programa; null u omitido = programa global de la finca"
                useAcid:
                  type: boolean
                  description: "Si es true, la finca usa ácido para bajar el pH del agua de riego y la IA debe tenerlo en cuenta"
                targetPh:
                  type: ["number", "null"]
                  minimum: 4
                  maximum: 7.5
                  description: "pH objetivo del agua de riego cuando se usa ácido; si se omite, se usa el rango 5,5–6,0"
      responses:
        "201":
          description: Created AI draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recommendation"
  /farms/{farmId}/recommendations/{recommendationId}:
    get:
      operationId: getRecommendation
      tags: [recommendations]
      parameters:
        - $ref: "#/components/parameters/FarmId"
        - $ref: "#/components/parameters/RecommendationId"
      responses:
        "200":
          description: Recommendation detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recommendation"
    patch:
      operationId: updateRecommendation
      tags: [recommendations]
      parameters:
        - $ref: "#/components/parameters/FarmId"
        - $ref: "#/components/parameters/RecommendationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecommendationUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recommendation"
  /farms/{farmId}/recommendations/{recommendationId}/status:
    post:
      operationId: changeRecommendationStatus
      tags: [recommendations]
      parameters:
        - $ref: "#/components/parameters/FarmId"
        - $ref: "#/components/parameters/RecommendationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecommendationStatusChange"
      responses:
        "200":
          description: Status changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recommendation"
  /farms/{farmId}/calculations:
    post:
      operationId: runCalculation
      tags: [recommendations]
      summary: Run the deterministic fertigation engine
      parameters:
        - $ref: "#/components/parameters/FarmId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalculationRequest"
      responses:
        "200":
          description: Calculation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalculationResult"

  /settings/openai:
    get:
      operationId: listCredentials
      tags: [settings]
      responses:
        "200":
          description: Masked credentials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Credential"
    post:
      operationId: createCredential
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialInput"
      responses:
        "201":
          description: Stored (masked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
  /settings/openai/{credentialId}:
    patch:
      operationId: updateCredential
      tags: [settings]
      parameters:
        - $ref: "#/components/parameters/CredentialId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialUpdate"
      responses:
        "200":
          description: Updated (masked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
    delete:
      operationId: deleteCredential
      tags: [settings]
      parameters:
        - $ref: "#/components/parameters/CredentialId"
      responses:
        "204":
          description: Deleted
  /settings/openai/{credentialId}/test:
    post:
      operationId: testCredential
      tags: [settings]
      parameters:
        - $ref: "#/components/parameters/CredentialId"
      responses:
        "200":
          description: Connection test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialTestResult"
  /farms/{farmId}/api-config:
    get:
      operationId: getFarmApiConfig
      tags: [settings]
      parameters:
        - $ref: "#/components/parameters/FarmId"
      responses:
        "200":
          description: Farm-specific credential override
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FarmApiConfig"
    put:
      operationId: setFarmApiConfig
      tags: [settings]
      parameters:
        - $ref: "#/components/parameters/FarmId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FarmApiConfigInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FarmApiConfig"

  /farms/{farmId}/conversations:
    get:
      operationId: listConversations
      tags: [conversations]
      parameters:
        - $ref: "#/components/parameters/FarmId"
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
    post:
      operationId: createConversation
      tags: [conversations]
      parameters:
        - $ref: "#/components/parameters/FarmId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
  /farms/{farmId}/conversations/{conversationId}:
    get:
      operationId: getConversation
      tags: [conversations]
      parameters:
        - $ref: "#/components/parameters/FarmId"
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationDetail"
    delete:
      operationId: deleteConversation
      tags: [conversations]
      parameters:
        - $ref: "#/components/parameters/FarmId"
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "204":
          description: Deleted
  /farms/{farmId}/conversations/{conversationId}/messages:
    post:
      operationId: sendMessage
      tags: [conversations]
      summary: Send a message to the virtual agronomist and receive its reply
      parameters:
        - $ref: "#/components/parameters/FarmId"
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "200":
          description: Assistant reply (includes the stored user message and assistant message)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
  /farms/{farmId}/conversations/{conversationId}/attachments:
    post:
      operationId: uploadConversationAttachment
      tags: [conversations]
      summary: Attach a document (PDF) or image to the conversation; its content is extracted and added as a user message
      parameters:
        - $ref: "#/components/parameters/FarmId"
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                note:
                  type: string
      responses:
        "201":
          description: Stored user message containing the extracted content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /farms/{farmId}/conversations/{conversationId}/messages/{messageId}/draft-recommendation:
    post:
      operationId: createDraftFromMessage
      tags: [conversations]
      summary: Turn an assistant reply into a draft fertilization program (source ai)
      parameters:
        - $ref: "#/components/parameters/FarmId"
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/MessageId"
      responses:
        "201":
          description: Draft recommendation created from the assistant message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recommendation"

  /farms/{farmId}/reports:
    get:
      operationId: listReports
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/FarmId"
      responses:
        "200":
          description: Reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Report"
    post:
      operationId: createReport
      tags: [reports]
      parameters:
        - $ref: "#/components/parameters/FarmId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportInput"
      responses:
        "201":
          description: Generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"

  /farms/{farmId}/reports/notes-preview:
    post:
      operationId: previewReportNotes
      tags: [reports]
      summary: Generate an on-demand preview of the «Observaciones del técnico» section for a conversation
      parameters:
        - $ref: "#/components/parameters/FarmId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportNotesPreviewInput"
      responses:
        "200":
          description: Preview of the technician notes that would appear in the report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportNotesPreview"

  /farms/{farmId}/phyto/treatments:
    get:
      operationId: listPhytoTreatments
      tags: [phyto]
      summary: List phytosanitary treatments of a farm
      parameters:
        - $ref: "#/components/parameters/FarmId"
      responses:
        "200":
          description: Treatments ordered by application date (newest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PhytoTreatment"
    post:
      operationId: createPhytoTreatment
      tags: [phyto]
      summary: Register a phytosanitary application
      parameters:
        - $ref: "#/components/parameters/FarmId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
