kind = "mobile"
previewPath = "/agronutri-movil/"
title = "AgroNutri Móvil"
description = "App móvil para encargados y técnicos de fincas plataneras: consulta de fincas, analíticas, programa de abonado vigente y chat con el técnico virtual, reutilizando el backend de AgroNutri."
version = "1.0.0"
id = "artifacts/agronutri-movil"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/agronutri-movil/" ]
localPort = 19394

[services.development]
run = "pnpm --filter @workspace/agronutri-movil run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/agronutri-movil", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/agronutri-movil", "run", "serve" ]

[services.env]
PORT = "19394"
BASE_PATH = "/agronutri-movil/"
