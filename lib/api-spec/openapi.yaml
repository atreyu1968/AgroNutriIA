components:
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
    FarmId:
      name: farmId
      in: path
      required: true
      schema:
        type: integer
    SectorId:
      name: sectorId
      in: path
      required: true
      schema:
        type: integer
    MemberId:
      name: memberId
      in: path
      required: true
      schema:
        type: integer
    AnalysisId:
      name: analysisId
      in: path
      required: true
      schema:
        type: integer
    FertilizerId:
      name: fertilizerId
      in: path
      required: true
      schema:
        type: integer
    RecommendationId:
      name: recommendationId
      in: path
      required: true
      schema:
        type: integer
    CredentialId:
      name: credentialId
      in: path
      required: true
      schema:
        type: integer
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: integer
    MessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: integer

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    RegisterInput:
      type: object
      required: [email, password, name]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        name: { type: string, minLength: 1 }
        company: { type: string }
        phone: { type: string }
    ForgotPasswordInput:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    ResetPasswordInput:
      type: object
      required: [token, password]
      properties:
        token: { type: string, minLength: 1 }
        password: { type: string, minLength: 8 }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    UserProfile:
      type: object
      required: [id, email, name, role, isAdmin]
      properties:
        id: { type: integer }
        email: { type: string }
        name: { type: string }
        company: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        role: { type: string }
        isAdmin: { type: boolean }
        unitsPreference: { type: ["string", "null"] }
        reportLanguage: { type: ["string", "null"] }
        aiMonthlyLimitEur: { type: ["number", "null"] }
        aiResponseStyle: { type: ["string", "null"] }
        token:
          type: ["string", "null"]
          description: "Session token for Bearer auth (returned by login/register; used by the mobile app)"
    UserProfileUpdate:
      type: object
      properties:
        name: { type: string }
        company: { type: string }
        phone: { type: string }
        unitsPreference: { type: string }
        reportLanguage: { type: string }
        aiMonthlyLimitEur: { type: ["number", "null"] }
        aiResponseStyle: { type: string }
        password: { type: string, minLength: 8 }

    AdminUser:
      type: object
      required: [id, email, name, role, isAdmin, active, farmCount, createdAt]
      properties:
        id: { type: integer }
        email: { type: string }
        name: { type: string }
        company: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        role: { type: string }
        isAdmin: { type: boolean }
        active: { type: boolean }
        aiMonthlyLimitEur: { type: ["number", "null"] }
        farmCount: { type: integer }
        createdAt: { type: string }
    AdminUserUpdate:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1 }
        role: { type: string, enum: [owner, technician, manager, viewer] }
        isAdmin: { type: boolean }
        active: { type: boolean }
        aiMonthlyLimitEur: { type: ["number", "null"], minimum: 0 }
        password: { type: string, minLength: 8 }
    PhytoTreatment:
      type: object
      required: [id, farmId, sectorId, sectorName, applicationDate, productName, registryNumber, activeIngredient, targetPest, doseAmount, doseUnit, waterVolumeL, areaHa, safetyDays, notes, createdByName, createdAt]
      properties:
        id: { type: integer }
        farmId: { type: integer }
        sectorId: { type: integer, nullable: true }
        sectorName: { type: string, nullable: true }
        applicationDate: { type: string }
        productName: { type: string }
        registryNumber: { type: string, nullable: true }
        activeIngredient: { type: string, nullable: true }
        targetPest: { type: string, nullable: true }
        doseAmount: { type: number, nullable: true }
        doseUnit: { type: string, nullable: true }
        waterVolumeL: { type: number, nullable: true }
        areaHa: { type: number, nullable: true }
        safetyDays: { type: integer, nullable: true }
        notes: { type: string, nullable: true }
        createdByName: { type: string, nullable: true }
        createdAt: { type: string }
    PhytoTreatmentCreate:
      type: object
      required: [applicationDate, productName]
      properties:
        sectorId: { type: integer, nullable: true }
